[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure"
version = "0.1.0"
description = "A tiny deterministic text-adventure engine where the LLM is an optional language interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
adventure = "adventure.cli:main"
adventure-web = "adventure.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adventure = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
