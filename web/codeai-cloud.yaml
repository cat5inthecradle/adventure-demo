name: adventure-lab
description: "Adventure Lab: a text adventure you can look under the hood of — a step-by-step view
  of the parser, the world state, and an optional in-browser language model (WebLLM)."
owner: darin@code.org
kind: static
tier: internal
runtime:
  package: image
  port: 8080
  memory_mb: 1024
  timeout_seconds: 30
  architecture: x86_64
  response_streaming: true
  env: {}
storage:
  dynamodb: false
  s3: false
static:
  dir: dist
  index_document: index.html
  error_document: ""
connections: []
budget_cap_usd_month: 0
