# Deploys this project to CodeAI Cloud: every push to main updates the internal version
# (<name>.<internal domain>); a merge into the protected `public` branch — after cloud-ops review —
# updates the public version, if the project has been promoted (docs/PROMOTION.md).
#
# Generated by `codeai-cloud init`. All the machinery — the toolchain, the deploy CLI, the Terraform —
# lives in codeai-staff-apps/codeai-cloud, so this file should never need to change. Edit
# codeai-cloud.yaml to change *what* gets deployed, or re-run `/deploy` and answer again.
name: Deploy

on:
  push:
    branches: [main, public]
  workflow_dispatch: {}

# Required: the job proves who it is to AWS with a short-lived OIDC token instead of stored keys.
# pull-requests: read and checks: read let a public release check its own review and required checks
# before deploying.
permissions:
  id-token: write
  contents: read
  pull-requests: read
  checks: read

jobs:
  deploy:
    uses: codeai-staff-apps/codeai-cloud/.github/workflows/deploy.yml@main
    # Only the two secrets the platform's workflow uses (reading the private platform repo) — never
    # `secrets: inherit`, which would hand it every secret this repo has.
    secrets:
      CODEAI_CLOUD_APP_PRIVATE_KEY: ${{ secrets.CODEAI_CLOUD_APP_PRIVATE_KEY }}
      CODEAI_CLOUD_PLATFORM_TOKEN: ${{ secrets.CODEAI_CLOUD_PLATFORM_TOKEN }}
    with:
      platform-ref: main
