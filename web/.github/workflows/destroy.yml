# Removes this project's cloud resources. Runs only when dispatched — by `codeai-cloud destroy`
# (through the deploy broker) or from the Actions tab. It does NOT run on push.
#
# Dispatched on main it removes the whole project (refused while a public version exists). Dispatched
# on `public` it takes down only the public version (`codeai-cloud unpublish`); the internal one and
# its data are untouched.
#
# Generated by `codeai-cloud init`; the machinery lives in codeai-staff-apps/codeai-cloud.
name: Destroy
run-name: "Destroy ${{ github.repository }}@${{ github.ref_name }} (${{ inputs.request_id }})"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Broker request id (leave blank when running by hand).
        type: string
        required: false
        default: manual

permissions:
  id-token: write
  contents: read
  pull-requests: read
  checks: read

jobs:
  destroy:
    uses: codeai-staff-apps/codeai-cloud/.github/workflows/deploy.yml@main
    # Only the two secrets the platform's workflow uses (reading the private platform repo) — never
    # `secrets: inherit`, which would hand it every secret this repo has.
    secrets:
      CODEAI_CLOUD_APP_PRIVATE_KEY: ${{ secrets.CODEAI_CLOUD_APP_PRIVATE_KEY }}
      CODEAI_CLOUD_PLATFORM_TOKEN: ${{ secrets.CODEAI_CLOUD_PLATFORM_TOKEN }}
    with:
      mode: destroy
      platform-ref: main
